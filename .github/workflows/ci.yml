name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  boot-sector:
    name: Boot sector
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check project evidence
        run: |
          python3 scripts/check_project_evidence.py
          python3 scripts/check_project_evidence.py --as-of "$(date -u +%F)" --strict

      - name: Assemble with warnings denied
        run: nasm -Wall -Werror -f bin -o boot.bin boot.asm

      - name: Verify boot-sector contract
        run: python3 scripts/verify_boot.py boot.bin
