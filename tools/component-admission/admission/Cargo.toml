[package]
name = "makopa-component-admission"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
wasmparser = { version = "=0.258.0", default-features = false, features = ["std", "validate", "features", "component-model"] }
wit-parser = { version = "=0.258.0", default-features = false, features = ["std"] }

[dev-dependencies]
wasm-encoder = { version = "=0.258.0", default-features = false, features = ["std", "component-model"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "makopa-component-admission"
path = "src/main.rs"
