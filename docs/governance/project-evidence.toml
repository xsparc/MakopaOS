[[research_decisions]]
id = "RSH-OS012-FINAL-MAP-2026Q3"
finding = "The final MemoryMapOwned returned by uefi 0.39 after ExitBootServices is authoritative for described memory and can be sorted in place without boot-service allocation; UEFI permits physical ranges outside the map, so framebuffer MMIO is overlaid where it intersects rather than required to be map-covered."
disposition = "adopted"
source_urls = ["https://docs.rs/uefi/0.39.0/uefi/boot/fn.exit_boot_services.html", "https://docs.rs/uefi/0.39.0/uefi/mem/memory_map/struct.MemoryMapOwned.html", "https://uefi.org/specs/UEFI/2.11/07_Services_Boot_Services.html#efi-boot-services-getmemorymap"]
observed_on = "2026-08-11"
reviewed_on = "2026-08-11"
review_due = "2026-09-11"
decision_ref = "docs/roadmap/implementation-roadmap.md#os012-boot-handoff-validation"

[[research_decisions]]
id = "RSH-OS013-FRAME-OWNERSHIP-2026Q3"
finding = "UEFI memory-type ownership and early allocator tradeoffs support copying only usable ranges into bounded kernel-owned extents while deferring buddy allocation and loader-memory reclamation until their requirements exist."
disposition = "adopted"
source_urls = ["https://uefi.org/specs/UEFI/2.11/07_Services_Boot_Services.html#efi-boot-services-getmemorymap", "https://cdn.kernel.org/doc/html/latest/mm/physical_memory.html"]
observed_on = "2026-08-11"
reviewed_on = "2026-08-11"
review_due = "2026-09-11"
decision_ref = "docs/architecture/decisions/0002-frame-ownership-and-early-allocation.md"

[[research_decisions]]
id = "RSH-OS020-STATIC-STORAGE-2026Q3"
finding = "Rust 2024 rejects references to static mut, so OS020 uses a narrow immutable UnsafeCell wrapper for its single-threaded kernel allocator; Kani 0.67 remains outside this slice because its UnsafeCell support is partial and does not verify assembly, aliasing, or data races."
disposition = "adopted"
source_urls = ["https://doc.rust-lang.org/nightly/edition-guide/rust-2024/static-mut-references.html", "https://doc.rust-lang.org/core/cell/struct.UnsafeCell.html", "https://model-checking.github.io/kani/rust-feature-support.html", "https://github.com/model-checking/kani/releases/tag/kani-0.67.0"]
observed_on = "2026-08-11"
reviewed_on = "2026-08-11"
review_due = "2026-09-11"
decision_ref = "docs/roadmap/implementation-roadmap.md#os020-physical-frame-allocator"

[[research_decisions]]
id = "RSH-OS014-ADDRESS-SPACE-LIFECYCLE-2026Q3"
finding = "Current x86-64, stable Rust, paging-invalidation, and comparable-kernel evidence supports an owned recovery root, stable assembly exception trampolines, exact user-fault classification, and unmap and invalidation before frame reuse."
