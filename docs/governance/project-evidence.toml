[[research_decisions]]
id = "RSH-LOCKED-DEPENDENCY-BOUNDARY-2026Q4"
finding = "Recent Rust ecosystem incidents reinforce exact versions, committed lockfiles, offline post-fetch verification, explicit feature review, dependency audits, and distrust of undeclared build-time behavior. The component-admission host workspace therefore remains separately locked, default-feature-minimized, tested offline after exact fetch, audited in the existing read-only CI job, and absent from the target runtime."
disposition = "adopted"
source_urls = ["https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/", "https://blog.rust-lang.org/2026/05/25/cve-2026-5222/", "https://docs.github.com/en/actions/reference/security/secure-use", "https://slsa.dev/spec/v1.2/verifying-artifacts"]
observed_on = "2026-10-07"
reviewed_on = "2026-10-07"
review_due = "2026-11-07"
decision_ref = "docs/development/component-admission.md#verification"

