[[research_decisions]]
id = "RSH-OS041A-TOOLCHAIN-2026Q4"
finding = "Rust 1.99.0 and uefi 0.41.0 are current while Wasmtime 49.0.2 and the patched 48.0.5 LTS line supersede the earlier 48.0.1 compile-study input. The current host precheck retains the accepted Rust 1.97.1 reproducibility baseline and introduces no UEFI or Wasmtime dependency. A future contained compile-measurement worker must receive a separately reviewed patch-level pin and may not implement 48.0.1."
disposition = "adopted"
source_urls = ["https://blog.rust-lang.org/2026/10/01/Rust-1.99.0/", "https://docs.rs/crate/uefi/0.41.0", "https://github.com/bytecodealliance/wasmtime/releases/tag/v49.0.2", "https://github.com/bytecodealliance/wasmtime/releases/tag/v48.0.5"]
