[[research_decisions]]
id = "RSH-OS015-COOPERATIVE-SCHEDULER-IPC-2026Q3"
finding = "Current x86-64, stable Rust, seL4, and Zircon evidence supports proving complete admitted task context and bounded IPC with a cooperative two-task FIFO before adding timer, SMP, dynamic-channel, or handle policy."
disposition = "adopted"
source_urls = ["https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html", "https://docs.amd.com/v/u/en-US/24593_3.44_APM_Vol2", "https://doc.rust-lang.org/reference/inline-assembly.html", "https://docs.sel4.systems/releases/sel4/16.0.0.html", "https://docs.sel4.systems/Tutorials/ipc", "https://fuchsia.dev/fuchsia-src/concepts/kernel/kernel_scheduling", "https://fuchsia.dev/fuchsia-src/reference/kernel_objects/channel"]
observed_on = "2026-08-13"
reviewed_on = "2026-08-13"
review_due = "2026-09-12"
decision_ref = "docs/architecture/decisions/0004-cooperative-scheduler-and-inline-ipc.md"

[[research_decisions]]
id = "RSH-OS016-CAPABILITY-HANDLES-2026Q3"
finding = "Current seL4 capability-slot and Zircon process-local handle models, reinforced by current agent-containment evidence, support fixed task-local tables whose typed entries and subset rights provide authority independently of selector secrecy; cross-task transfer and recursive revocation remain deferred."
disposition = "adopted"
source_urls = ["https://docs.sel4.systems/Tutorials/capabilities.html", "https://fuchsia.dev/fuchsia-src/concepts/kernel/handles", "https://fuchsia.dev/fuchsia-src/concepts/kernel/rights", "https://fuchsia.dev/reference/syscalls/handle_duplicate", "https://fuchsia.dev/fuchsia-src/get-started/learn/intro/sandboxing", "https://www.nccoe.nist.gov/sites/default/files/2026-02/accelerating-the-adoption-of-software-and-ai-agent-identity-and-authorization-concept-paper.pdf", "https://openai.com/index/hugging-face-model-evaluation-security-incident/"]
observed_on = "2026-08-13"
reviewed_on = "2026-08-13"
review_due = "2026-09-12"
decision_ref = "docs/architecture/decisions/0005-task-local-capability-handles.md"

[[research_decisions]]
id = "RSH-OS012-FRAMEBUFFER-2026Q3"
finding = "UEFI GOP mode and framebuffer values must be copied while the protocol is live; version one carries only RGB or BGR numeric metadata and reports bitmask or blit-only modes as unavailable."
disposition = "adopted"
source_urls = ["https://docs.rs/uefi/0.39.0/uefi/proto/console/gop/struct.GraphicsOutput.html", "https://uefi.org/specs/UEFI/2.11/12_Protocols_Console_Support.html"]
