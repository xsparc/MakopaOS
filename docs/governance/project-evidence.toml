[[research_decisions]]
id = "RSH-OS040-COMPONENT-ADMISSION-2026Q3"
finding = "Profile-zero admission selects WebAssembly 1.0 plus the base Component Model. Fixture production pins Rust 1.97.1, wasm32v1-none, and the exact published wit-bindgen 0.61.1 package; uses macros only; preserves deterministic component-type metadata while disabling custom-section link helpers, semver import merging, LTO, and linker-plugin LTO; and prohibits adapters, libraries, binding overrides, and import remapping. Because wit-bindgen 0.61.1 emits legacy core names, compatibility is confined to componentization of the exact verified producer output; supplied WIT and final-component identities reject legacy aliases and parallel names. The only allocation machinery permitted in the fixture is the exact pinned realloc scaffold, its versioned wrapper, and a fixture-local trap-only allocation sentinel. Link, call-graph, and disassembly evidence must prove zero memory.grow and no task-path reachability to realloc, allocation, or panic code. The isolated offline build binds exact source-tree, registry-package, binary-inventory, Cargo, rustc, LLD, link-extraction, section, symbol, and target-feature evidence. Independent admission pins the wasmparser, wit-component, and wit-parser 0.258.0 family; enables only the required wasmparser compile-time features; applies exact runtime masks; independently validates the final bytes; and requires byte-equal fixed semantic graphs from raw imports and exports, decoded metadata, and in-memory parsed supplied WIT. It rejects semver normalization, legacy or parallel final identities, implements, version_suffix, external_id, and all unselected Component Model extensions. Fixed-width little-endian records bind exact SHA-256 digests and a verifier-only Ed25519 message; the repository holds no signer or private seed. Decoder and compiler workers use a versioned READY protocol, bounded pipes and resource limits, fail closed where containment is unavailable, and cannot publish partial results. Wasmtime 48.0.1 remains a compile-only P0/P2 measurement input with only component-model and cranelift enabled; P3 adds component-model-async in a separate build. Neither worker instantiates or executes a component, and Wasmtime's embedded 0.254.0 parser is differential evidence only. Admission performs complete import enumeration and exact allowlisting of the console import and task export; the 65536-byte profile-zero WIT limit is distinct from the 131072-byte non-admission P2 and P3 study envelopes."
disposition = "adopted"
source_urls = ["https://doc.rust-lang.org/rustc/platform-support/wasm32v1-none.html", "https://doc.rust-lang.org/rustc/codegen-options/", "https://doc.rust-lang.org/rustc/remap-source-paths.html", "https://github.com/rust-lang/rust/issues/145491", "https://doc.rust-lang.org/cargo/reference/config.html", "https://doc.rust-lang.org/cargo/reference/build-scripts.html", "https://doc.rust-lang.org/cargo/reference/registry-index.html", "https://github.com/bytecodealliance/wit-bindgen/releases/tag/v0.61.1", "https://github.com/bytecodealliance/wit-bindgen/blob/v0.61.1/crates/guest-rust/build.rs", "https://github.com/bytecodealliance/wit-bindgen/blob/v0.61.1/crates/guest-rust/src/rt/mod.rs", "https://github.com/bytecodealliance/wit-bindgen/blob/v0.61.1/crates/rust/src/lib.rs", "https://docs.rs/crate/wit-bindgen-rust/0.61.1/source/src/interface.rs", "https://docs.rs/crate/wit-bindgen/0.61.1/source/src/rt/wit_bindgen_cabi_realloc.rs", "https://github.com/bytecodealliance/wit-bindgen/tree/v0.61.1/tests/runtime/rust/disable-custom-section-link-helpers", "https://docs.rs/crate/wit-bindgen/0.61.1/features", "https://docs.rs/wit-bindgen/0.61.1/wit_bindgen/macro.generate.html", "https://docs.rs/crate/wasmparser/0.258.0/features", "https://docs.rs/wasmparser/0.258.0/wasmparser/struct.WasmFeatures.html", "https://docs.rs/wasmparser/0.258.0/wasmparser/struct.Validator.html", "https://docs.rs/wit-component/0.258.0/wit_component/struct.ComponentEncoder.html#method.reject_legacy_names", "https://docs.rs/wit-component/0.258.0/wit_component/fn.decode.html", "https://docs.rs/wit-component/0.258.0/wit_component/metadata/fn.encode.html", "https://docs.rs/wit-parser/0.258.0/wit_parser/struct.SourceMap.html", "https://docs.rs/wit-parser/0.258.0/wit_parser/struct.Resolve.html", "https://github.com/WebAssembly/component-model/pull/378", "https://github.com/bytecodealliance/wasm-tools/issues/2506", "https://docs.rs/crate/wasmtime/48.0.1", "https://github.com/bytecodealliance/wasmtime/releases/tag/