[[research_decisions]]
id = "RSH-OS011-UEFI-LIFETIME-2026Q3"
finding = "uefi 0.39 invalidates boot-services protocols and its global allocator after ExitBootServices, so the OS011 loader drops protocol guards and heap-backed values before the one-way transition."
disposition = "adopted"
source_urls = ["https://docs.rs/uefi/0.39.0/uefi/boot/fn.exit_boot_services.html"]
observed_on = "2026-08-11"
reviewed_on = "2026-08-11"
review_due = "2026-09-11"
decision_ref = "docs/roadmap/implementation-roadmap.md#os011-x86-64-kernel-entry"

[[research_decisions]]
id = "RSH-OS011-BOOT-HARNESS-2026Q3"
finding = "QEMU read-only virtual FAT directories provide an image-tool-free ESP for the bounded smoke test, while executable device inspection confirms the pinned binary exposes isa-debug-exit before boot."
disposition = "adopted"
source_urls = ["https://www.qemu.org/docs/master/system/images.html#virtual-fat-disk-images"]
observed_on = "2026-08-11"
reviewed_on = "2026-08-11"
