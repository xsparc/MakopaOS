[[research_decisions]]
id = "RSH-OS040-SOURCE-MANIFEST-2026Q3"
finding = "BuildEvidenceV1 retains its fixed 256-byte layout and the admission signature retains its exact 318-byte message while source-revision kind 1 becomes a bounded canonical MakopaOS source manifest. The signed manifest fixes the repository and subtree, carries the repository's Git SHA-1 tree object ID only as a locator, and independently binds every accepted regular-file path, mode, byte length, and content with SHA-256. Trusted staging reconstructs the complete inventory from committed Git objects at an explicit expected revision, reads back a fresh no-follow staging root, and excludes working-tree, .git, hook, configuration, untracked, modified, and persisted-credential content. A matching SHA-1 locator never overrides a source-manifest or per-file SHA-256 mismatch."
disposition = "adopted"
source_urls = ["https://git-scm.com/docs/hash-function-transition.html", "https://git-scm.com/docs/git-ls-tree", "https://git-scm.com/docs/git-cat-file", "https://git-scm.com/docs/gitdatamodel.html", "https://slsa.dev/spec/v1.2/source-requirements", "https://github.com/in-toto/attestation/blob/main/spec/v1/digest_set.md"]
observed_on = "2026-09-02"
reviewed_on = "2026-10-07"
review_due = "2026-11-07"
decision_ref = "docs/architecture/decisions/0008-versioned-console-component-host-contract.md#build-evidence"

