[workspace]
members = [
    "crates/address-space",
    "crates/boot-contract",
    "crates/frame-allocator",
    "crates/kernel-image",
    "kernel",
    "loader",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
makopa-boot-contract = { path = "crates/boot-contract" }
makopa-address-space = { path = "crates/address-space" }
makopa-frame-allocator = { path = "crates/frame-allocator" }
makopa-kernel-image = { path = "crates/kernel-image" }
x86_64 = { version = "=0.15.5", default-features = false, features = ["instructions"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
